<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>💄 Beauty Haven</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>💄 Beauty Haven</h1>
    <div class="cart-icon">🛒 <span id="cart-count">0</span></div>
  </header>

  <main>
    <section>
      <h2>Our Products</h2>
      <div id="product-list" class="grid"></div>
    </section>

    <aside>
      <h2>Your Cart</h2>
      <ul id="cart-items"></ul>
      <p><strong>Total: Ksh <span id="cart-total">0</span></strong></p>
      <button id="clear-cart">Clear Cart</button>
    </aside>
  </main>

  <footer>
    <p>© 2025 Beauty Haven | Powered by JSON Server</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
